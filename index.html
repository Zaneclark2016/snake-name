<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON ZOMBIE SURVIVAL</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui}body{touch-action:none}canvas{width:100%;height:100%;display:block}#hud{position:fixed;inset:0;pointer-events:none}#score,#hp{position:absolute;top:12px;padding:8px 12px;background:#06101dcc;border-radius:12px;font-weight:800}#score{left:12px}#hp{right:12px}#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 8px #6ef}#cross:before{width:22px;height:2px;top:10px}#cross:after{height:22px;width:2px;left:10px}.hidden{display:none!important}#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020712ee}.panel{width:min(88vw,420px);padding:30px;text-align:center;border:1px solid #5deaff55;border-radius:24px;background:#07111eee}h1{font-size:48px;margin:0}.sub{color:#abc;margin-bottom:24px}button{padding:14px 28px;border:0;border-radius:14px;background:#65eaff;font-size:18px;font-weight:900}.small{font-size:13px;color:#8196aa;margin-top:18px;line-height:1.5}</style></head><body><canvas id="g"></canvas><div id="hud" class="hidden"><b id="score">SCORE 0</b><b id="hp">HP 100</b><b id="wave" style="position:absolute;top:58px;left:50%;transform:translateX(-50%);padding:7px 11px;background:#06101dcc;border-radius:10px">WAVE 1</b><div id="cross"></div></div><div id="menu"><div class="panel"><h1 id="title">NEON FPS</h1><p class="sub" id="sub">3D arcade first-person target game.</p><button id="start">START</button><div class="small">Desktop: WASD/arrows to move, mouse to aim.<br>iPad: drag right to look and tap to fire; drag left to move.</div></div></div><script>
const c=document.getElementById("g"),x=c.getContext("2d"),menu=document.getElementById("menu"),hud=document.getElementById("hud"),sc=document.getElementById("score"),hpv=document.getElementById("hp"),start=document.getElementById("start"),title=document.getElementById("title"),sub=document.getElementById("sub");
let W,H,D=1,run=false,last=0,score=0,hp=100,cd=0,keys={},joy={x:0,y:0},look=null,mt=null,wave=0,waveKills=0,waveTotal=0,nextWaveTimer=0,bullets=[],fireHeld=false,audio=null;
const map=["111111111111111","100000000000001","100000000000001","100000000000001","100000000000001","100000000000001","100000000000001","100000000000001","100000000000001","100000000000001","100000000000001","100000000000001","111111111111111"],FOV=Math.PI/3,p={x:2.5,y:1.8,a:0};let bots=[];
function size(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener("resize",size);size();
function wall(a,b){return a<0||b<0||a>=15||b>=13||map[Math.floor(b)][Math.floor(a)]==="1"}function ray(a){let dx=Math.cos(a),dy=Math.sin(a),xx=p.x,yy=p.y,d=0;while(d<30){xx+=dx*.03;yy+=dy*.03;d+=.03;if(wall(xx,yy))break}return d}
function initAudio(){try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)()}if(audio.state==="suspended")audio.resume()}
function tone(freq,duration,type="square",volume=.04,slide=0){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain(),now=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,now);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),now+duration);g.gain.setValueAtTime(volume,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+duration)}
function shootSound(){tone(180,.08,"square",.055,-80);tone(520,.045,"sawtooth",.025,-260)}
function hitSound(){tone(110,.12,"triangle",.045,180);tone(70,.16,"sine",.025,-30)}
function damageSound(){tone(90,.16,"sawtooth",.045,-45)}
function startSound(){tone(440,.1,"sine",.03,180);setTimeout(()=>tone(660,.12,"sine",.03,180),80)}
function gameOverSound(){tone(220,.25,"sawtooth",.04,-130);setTimeout(()=>tone(110,.4,"sine",.035,-50),120)}
function spawn(){let spots=[[11.5,1.5],[9.5,3.5],[12.5,5.5],[4.5,9.5],[10.5,10.5],[7.5,5.5],[2.5,10.5]];let s=spots[Math.floor(Math.random()*spots.length)];if(Math.hypot(s[0]-p.x,s[1]-p.y)<4)return spawn();bots.push({x:s[0],y:s[1],speed:.010+wave*.0015,hp:100,maxHp:100})}
function startWave(){wave++;waveKills=0;waveTotal=5+wave*3;for(let i=0;i<waveTotal;i++)setTimeout(()=>run&&spawn(),i*180);document.getElementById("wave").textContent="WAVE "+wave}
function waveCheck(dt){if(bots.length===0&&wave>0&&waveKills>=waveTotal){nextWaveTimer-=dt;if(nextWaveTimer<=0){nextWaveTimer=2.5;hp=Math.min(100,hp+20);ui();startWave()}}}
function ui(){sc.textContent="SCORE "+score;hpv.textContent="HP "+Math.max(0,Math.floor(hp));document.getElementById("wave").textContent="WAVE "+wave+" • "+waveKills+"/"+waveTotal}
function reset(){p.x=2.5;p.y=1.8;p.a=0;score=0;hp=100;cd=0;fireHeld=false;bots=[];bullets=[];wave=0;waveKills=0;waveTotal=0;nextWaveTimer=0;ui();startWave()}
function gameOver(){gameOverSound();run=false;hud.classList.add("hidden");menu.classList.remove("hidden");title.textContent="SURVIVED "+wave+" WAVES";sub.textContent="Score "+score+" • "+waveKills+" zombies defeated in the last wave.";start.textContent="PLAY AGAIN"}
function fire(){if(!run||cd>0)return;cd=.2;bullets.push({t:0});shootSound();let best=null,bd=99;for(const b of bots){let dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx)-p.a;while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;if(Math.abs(a)<.11&&d<bd&&d<ray(p.a)){best=b;bd=d}}if(best){best.hp-=50;if(best.hp<=0){score+=100+wave*10;waveKills++;bots=bots.filter(q=>q!==best)}hitSound();ui()}}
function move(dx,dy){let nx=p.x+dx,ny=p.y+dy;if(!wall(nx,p.y))p.x=nx;if(!wall(p.x,ny))p.y=ny}
function update(dt){cd=Math.max(0,cd-dt);if(fireHeld)fire();for(const b of bullets)b.t+=dt*5;bullets=bullets.filter(b=>b.t<1);waveCheck(dt);let mx=0,my=0;if(keys.w||keys.arrowup)my++;if(keys.s||keys.arrowdown)my--;if(keys.a)mx--;if(keys.d)mx++;if(keys.arrowleft)p.a-=2.5*dt;if(keys.arrowright)p.a+=2.5*dt;mx+=joy.x;my+=joy.y;let l=Math.hypot(mx,my)||1,s=.08*dt*60,fx=Math.cos(p.a),fy=Math.sin(p.a),rx=-fy,ry=fx;move((fx*my+rx*mx)/l*s,(fy*my+ry*mx)/l*s);for(const b of bots){let dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy);if(d>1.2){let q=b.speed*dt*60;b.x+=dx/d*q;b.y+=dy/d*q;if(wall(b.x,b.y)){b.x-=dx/d*q;b.y-=dy/d*q}}else{hp-=10*dt;damageSound();ui();if(hp<=0)return gameOver()}}}
function draw(){let h=H/2;let sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,"#5ec8ff");sky.addColorStop(.55,"#a8e6ff");sky.addColorStop(1,"#e8f9ff");x.fillStyle=sky;x.fillRect(0,0,W,h);let ground=x.createLinearGradient(0,h,0,H);ground.addColorStop(0,"#9dcc72");ground.addColorStop(.5,"#b9df86");ground.addColorStop(1,"#d7eea8");x.fillStyle=ground;x.fillRect(0,h,W,H-h);let n=Math.ceil(W/2),z=new Float32Array(n);for(let i=0;i<n;i++){let a=p.a-FOV/2+i/n*FOV,d=ray(a)*Math.cos(a-p.a);z[i]=d;let wh=Math.min(H*2,H/(d*.72)),yy=h-wh/2,sh=Math.max(.15,1-d/16);x.fillStyle="rgb("+~~(75+70*sh)+","+~~(105+85*sh)+","+~~(120+85*sh)+")";x.fillRect(i*2,yy,2,wh)}
bots.slice().sort((a,b)=>Math.hypot(b.x-p.x,b.y-p.y)-Math.hypot(a.x-p.x,a.y-p.y)).forEach(b=>{let dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx)-p.a;while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;if(Math.abs(a)>FOV*.65)return;let cd2=d*Math.cos(a),sx=(.5+a/FOV)*W,wh=Math.min(H*1.4,H/(cd2*.72)),zi=Math.max(0,Math.min(n-1,~~(sx/2)));if(cd2<=z[zi]+.1){x.save();x.translate(sx,h-wh*.15);x.fillStyle="#39d353";x.shadowColor="#8cff9a";x.shadowBlur=12;x.beginPath();x.arc(0,wh*.08,wh*.15,0,7);x.fill();x.shadowBlur=0;x.fillStyle="#168a3a";x.fillRect(-wh*.18,wh*.2,wh*.36,wh*.32);x.fillStyle="#d8ff72";x.beginPath();x.arc(-wh*.055,wh*.06,wh*.025,0,7);x.arc(wh*.055,wh*.06,wh*.025,0,7);x.fill();x.fillStyle="#07111e";x.fillRect(-wh*.24,-wh*.16,wh*.48,wh*.045);x.fillStyle="#39d353";x.fillRect(-wh*.24,-wh*.16,wh*.48*Math.max(0,b.hp/b.maxHp),wh*.045);x.strokeStyle="#ffffffaa";x.lineWidth=1;x.strokeRect(-wh*.24,-wh*.16,wh*.48,wh*.045);x.restore()}});x.save();for(const b of bullets){let q=b.t,by=H*.84-q*H*.34;x.globalAlpha=1-q*.35;x.fillStyle="#ffe600";x.shadowColor="#fff36a";x.shadowBlur=14;x.beginPath();x.arc(W/2,by,Math.max(3,7-q*3),0,7);x.fill();x.fillStyle="#fff9a8";x.beginPath();x.arc(W/2,by,Math.max(1.5,3-q*1.5),0,7);x.fill()}x.restore();x.save();x.translate(W/2,H*.88);x.lineJoin="round";x.lineCap="round";x.shadowColor="#0008";x.shadowBlur=18;x.shadowOffsetY=8;/* detailed sci-fi scanner/tool */x.fillStyle="#243747";x.strokeStyle="#0b1822";x.lineWidth=4;x.beginPath();x.moveTo(-58,62);x.lineTo(-48,5);x.lineTo(-31,-18);x.lineTo(-24,-72);x.lineTo(24,-72);x.lineTo(31,-18);x.lineTo(48,5);x.lineTo(58,62);x.closePath();x.fill();x.stroke();x.shadowBlur=0;x.shadowOffsetY=0;x.fillStyle="#40596b";x.beginPath();x.moveTo(-42,52);x.lineTo(-34,8);x.lineTo(-20,-8);x.lineTo(-16,-60);x.lineTo(16,-60);x.lineTo(20,-8);x.lineTo(34,8);x.lineTo(42,52);x.closePath();x.fill();x.fillStyle="#101d28";x.fillRect(-25,15,50,35);x.strokeStyle="#65eaff";x.lineWidth=2;x.strokeRect(-25,15,50,35);x.fillStyle="#65eaff";x.shadowColor="#65eaff";x.shadowBlur=12;x.fillRect(-17,24,34,5);x.fillRect(-10,34,20,4);x.shadowBlur=0;x.fillStyle="#172733";x.beginPath();x.roundRect(-13,-93,26,34,7);x.fill();x.strokeStyle="#65eaff";x.stroke();x.fillStyle="#bffcff";x.shadowColor="#65eaff";x.shadowBlur=16;x.beginPath();x.arc(0,-76,6,0,7);x.fill();x.shadowBlur=0;x.fillStyle="#0e1b25";x.fillRect(-38,58,76,12);x.fillStyle="#65eaff";x.fillRect(-27,61,10,4);x.fillRect(-5,61,10,4);x.fillRect(17,61,10,4);x.strokeStyle="#91a9b8";x.lineWidth=2;x.beginPath();x.moveTo(-35,-2);x.lineTo(-27,-18);x.moveTo(35,-2);x.lineTo(27,-18);x.stroke();x.restore()}
function loop(t){if(!run)return;let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();if(run)requestAnimationFrame(loop)}
function begin(){initAudio();startSound();reset();run=true;menu.classList.add("hidden");hud.classList.remove("hidden");last=performance.now();requestAnimationFrame(loop)}start.onclick=begin;
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
c.addEventListener("pointerdown",e=>{if(!run)return;if(e.clientX<W*.42){mt={id:e.pointerId,x:e.clientX,y:e.clientY}}else{look={id:e.pointerId,x:e.clientX,y:e.clientY};fireHeld=true;fire()}});
c.addEventListener("pointermove",e=>{if(mt&&e.pointerId===mt.id){joy.x=Math.max(-1,Math.min(1,(e.clientX-mt.x)/70));joy.y=-Math.max(-1,Math.min(1,(e.clientY-mt.y)/70))}if(look&&e.pointerId===look.id){p.a+=(e.clientX-look.x)*.008;look.x=e.clientX}});
c.addEventListener("pointerup",e=>{if(mt&&e.pointerId===mt.id){mt=null;joy={x:0,y:0}}if(look&&e.pointerId===look.id){look=null;fireHeld=false}});c.addEventListener("pointercancel",e=>{if(mt&&e.pointerId===mt.id){mt=null;joy={x:0,y:0}}if(look&&e.pointerId===look.id){look=null;fireHeld=false}});
</script></body></html>
