<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Blaster</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:white}
body{touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800;font-size:17px;pointer-events:none;text-shadow:0 2px 5px #000;z-index:2}
#hud span{background:rgba(4,10,20,.58);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:7px 10px}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,rgba(21,65,110,.55),rgba(3,8,17,.96));z-index:5}
.panel{width:min(88vw,430px);padding:28px;border-radius:24px;text-align:center;background:rgba(8,17,32,.9);border:1px solid rgba(104,221,255,.3);box-shadow:0 20px 70px #0008}
h1{margin:0 0 8px;font-size:44px;letter-spacing:-2px}
.sub{margin:0 0 24px;color:#a9bed4}
button{border:0;border-radius:15px;padding:14px 25px;font-size:18px;font-weight:800;color:#06101d;background:#6be7ff;box-shadow:0 8px 25px #35cfee44;cursor:pointer}
button:active{transform:scale(.97)}
.small{font-size:13px;color:#8299b1;margin-top:18px;line-height:1.5}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <span>Score: <b id="score">0</b></span>
  <span>Wave: <b id="wave">1</b></span>
  <span>Lives: <b id="lives">3</b></span>
</div>
<div id="menu">
  <div class="panel">
    <h1 id="title">NEON BLASTER</h1>
    <p class="sub" id="subtitle">Tap or click to fire. Survive the waves and hit the targets.</p>
    <button id="start">Start Game</button>
    <div class="small">On iPad: tap anywhere to shoot toward that spot.<br>Targets get faster as your score rises.</div>
  </div>
</div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score"),waveEl=document.getElementById("wave"),livesEl=document.getElementById("lives");
const menu=document.getElementById("menu"),title=document.getElementById("title"),subtitle=document.getElementById("subtitle"),start=document.getElementById("start"),hud=document.getElementById("hud");
let W=0,H=0,dpr=1,running=false,score=0,lives=3,wave=1,last=0,spawnTimer=0,shake=0;
let targets=[],shots=[],particles=[],stars=[];
const player={x:0,y:0};

function resize(){
  dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  player.x=W/2;player.y=H-70;
  if(!stars.length) for(let i=0;i<90;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.8+.3,a:Math.random()*.8+.2});
}
addEventListener("resize",resize); resize();

function reset(){
  score=0;lives=3;wave=1;targets=[];shots=[];particles=[];spawnTimer=0;shake=0;
  scoreEl.textContent=score;waveEl.textContent=wave;livesEl.textContent=lives;
  player.x=W/2;player.y=H-70;
}
function startGame(){
  reset();running=true;menu.classList.add("hidden");hud.classList.remove("hidden");last=performance.now();requestAnimationFrame(loop);
}
start.addEventListener("click",startGame);

function fire(tx,ty){
  if(!running)return;
  const dx=tx-player.x,dy=ty-player.y,len=Math.hypot(dx,dy)||1;
  shots.push({x:player.x,y:player.y,vx:dx/len*760,vy:dy/len*760,life:1});
  for(let i=0;i<4;i++) particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*80,vy:Math.random()*-80-20,life:.25,max:.25,r:Math.random()*2+1});
}
function pointer(e){
  const r=canvas.getBoundingClientRect(),x=(e.clientX??e.touches?.[0]?.clientX)-r.left,y=(e.clientY??e.touches?.[0]?.clientY)-r.top;
  fire(x,y);
}
canvas.addEventListener("pointerdown",pointer);

function spawn(){
  const edge=45;
  const r=16+Math.random()*17;
  targets.push({
    x:edge+r+Math.random()*(W-edge*2-r*2),y:-r,
    r,vy:65+wave*11+Math.random()*45,vx:(Math.random()-.5)*(35+wave*4),
    hp:1,phase:Math.random()*7
  });
}
function burst(x,y){
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*180+40;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.35,max:.85,r:Math.random()*3+1});
  }
}
function endGame(){
  running=false;hud.classList.add("hidden");menu.classList.remove("hidden");
  title.textContent="GAME OVER";subtitle.textContent="Final score: "+score+" • Wave "+wave;
  start.textContent="Play Again";
}

function update(dt){
  wave=1+Math.floor(score/100);waveEl.textContent=wave;
  spawnTimer-=dt;
  const interval=Math.max(.28,1.0-wave*.055);
  if(spawnTimer<=0){spawn();spawnTimer=interval*(.7+Math.random()*.5)}
  for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt}
  shots=shots.filter(s=>s.life>0&&s.x>-30&&s.x<W+30&&s.y>-30&&s.y<H+30);

  for(const t of targets){
    t.y+=t.vy*dt;t.x+=t.vx*dt;t.phase+=dt*3;
    if(t.x<t.r||t.x>W-t.r)t.vx*=-1;
  }
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];
    for(let j=targets.length-1;j>=0;j--){
      const t=targets[j],d=Math.hypot(s.x-t.x,s.y-t.y);
      if(d<t.r+6){
        score+=10;scoreEl.textContent=score;burst(t.x,t.y);targets.splice(j,1);shots.splice(i,1);shake=.08;break;
      }
    }
  }
  for(let i=targets.length-1;i>=0;i--){
    if(targets[i].y-targets[i].r>H){
      targets.splice(i,1);lives--;livesEl.textContent=lives;shake=.16;
      if(lives<=0){endGame();return}
    }
  }
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt}
  particles=particles.filter(p=>p.life>0);
  if(shake>0)shake-=dt;
}

function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*10,(Math.random()-.5)*10);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#08172a");g.addColorStop(1,"#030812");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const st of stars){ctx.globalAlpha=st.a;ctx.fillStyle="#bcecff";ctx.beginPath();ctx.arc(st.x,st.y,st.s,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;

  // subtle arena grid
  ctx.strokeStyle="rgba(70,170,210,.07)";ctx.lineWidth=1;
  for(let y=H-220;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,H-220);ctx.lineTo(x,H);ctx.stroke()}

  // shots
  for(const s of shots){
    ctx.strokeStyle="#7df5ff";ctx.lineWidth=4;ctx.lineCap="round";ctx.globalAlpha=Math.max(0,s.life);
    ctx.beginPath();ctx.moveTo(s.x-s.vx*.025,s.y-s.vy*.025);ctx.lineTo(s.x,s.y);ctx.stroke();
  }ctx.globalAlpha=1;

  // targets
  for(const t of targets){
    ctx.save();ctx.translate(t.x,t.y);
    const pulse=1+Math.sin(t.phase)*.08;ctx.scale(pulse,pulse);
    ctx.shadowBlur=18;ctx.shadowColor="#ff4f9a";ctx.fillStyle="#ff4f9a";ctx.beginPath();ctx.arc(0,0,t.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle="#102039";ctx.beginPath();ctx.arc(0,0,t.r*.63,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#ffdd72";ctx.beginPath();ctx.arc(0,0,t.r*.27,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // player ship
  ctx.save();ctx.translate(player.x,player.y);ctx.shadowBlur=18;ctx.shadowColor="#62eaff";
  ctx.fillStyle="#68eaff";ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(18,18);ctx.lineTo(0,11);ctx.lineTo(-18,18);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle="#0b2940";ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(0,17,5+Math.random()*3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.restore();

  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle="#ffd76a";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
  ctx.restore();
}

function loop(now){
  if(!running)return;
  const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(running)requestAnimationFrame(loop);
}
</script>
</body>
</html>
