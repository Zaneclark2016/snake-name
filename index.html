<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON FPS</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui}body{touch-action:none}canvas{width:100%;height:100%;display:block}#hud{position:fixed;inset:0;pointer-events:none}#score,#hp{position:absolute;top:12px;padding:8px 12px;background:#06101dcc;border-radius:12px;font-weight:800}#score{left:12px}#hp{right:12px}#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 8px #6ef}#cross:before{width:22px;height:2px;top:10px}#cross:after{height:22px;width:2px;left:10px}.hidden{display:none!important}#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020712ee}.panel{width:min(88vw,420px);padding:30px;text-align:center;border:1px solid #5deaff55;border-radius:24px;background:#07111eee}h1{font-size:48px;margin:0}.sub{color:#abc;margin-bottom:24px}button{padding:14px 28px;border:0;border-radius:14px;background:#65eaff;font-size:18px;font-weight:900}.small{font-size:13px;color:#8196aa;margin-top:18px;line-height:1.5}</style></head><body><canvas id="g"></canvas><div id="hud" class="hidden"><b id="score">SCORE 0</b><b id="hp">HP 100</b><div id="cross"></div></div><div id="menu"><div class="panel"><h1 id="title">NEON FPS</h1><p class="sub" id="sub">3D arcade first-person target game.</p><button id="start">START</button><div class="small">Desktop: WASD/arrows to move, mouse to aim.<br>iPad: drag right to look and tap to fire; drag left to move.</div></div></div><script>
const c=document.getElementById("g"),x=c.getContext("2d"),menu=document.getElementById("menu"),hud=document.getElementById("hud"),sc=document.getElementById("score"),hpv=document.getElementById("hp"),start=document.getElementById("start"),title=document.getElementById("title"),sub=document.getElementById("sub");
let W,H,D=1,run=false,last=0,score=0,hp=100,cd=0,keys={},joy={x:0,y:0},look=null,mt=null;
const map=["111111111111111","100000000000001","101111011111101","100001000010001","101101011010101","100100000000101","100101111110001","100100000010001","101111011011101","100000010000001","101111010111101","100000000000001","111111111111111"],FOV=Math.PI/3,p={x:2.5,y:1.8,a:0};let bots=[];
function size(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener("resize",size);size();
function wall(a,b){return a<0||b<0||a>=15||b>=13||map[Math.floor(b)][Math.floor(a)]==="1"}function ray(a){let dx=Math.cos(a),dy=Math.sin(a),xx=p.x,yy=p.y,d=0;while(d<30){xx+=dx*.03;yy+=dy*.03;d+=.03;if(wall(xx,yy))break}return d}
function spawn(){let s=[[11.5,1.5],[9.5,3.5],[12.5,5.5],[4.5,9.5],[10.5,10.5],[7.5,5.5],[2.5,10.5]][Math.floor(Math.random()*7)];if(Math.hypot(s[0]-p.x,s[1]-p.y)<3)return spawn();bots.push({x:s[0],y:s[1]})}
function ui(){sc.textContent="SCORE "+score;hpv.textContent="HP "+Math.max(0,Math.floor(hp))}
function reset(){p.x=2.5;p.y=1.8;p.a=0;score=0;hp=100;cd=0;bots=[];for(let i=0;i<7;i++)spawn();ui()}
function gameOver(){run=false;hud.classList.add("hidden");menu.classList.remove("hidden");title.textContent="GAME OVER";sub.textContent="Score "+score;start.textContent="PLAY AGAIN"}
function fire(){if(!run||cd>0)return;cd=.2;let best=null,bd=99;for(const b of bots){let dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx)-p.a;while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;if(Math.abs(a)<.11&&d<bd&&d<ray(p.a)){best=b;bd=d}}if(best){score+=100;bots=bots.filter(q=>q!==best);setTimeout(()=>run&&spawn(),250);ui()}}
function move(dx,dy){let nx=p.x+dx,ny=p.y+dy;if(!wall(nx,p.y))p.x=nx;if(!wall(p.x,ny))p.y=ny}
function update(dt){cd=Math.max(0,cd-dt);let mx=0,my=0;if(keys.w||keys.arrowup)my++;if(keys.s||keys.arrowdown)my--;if(keys.a)mx--;if(keys.d)mx++;if(keys.arrowleft)p.a-=2.5*dt;if(keys.arrowright)p.a+=2.5*dt;mx+=joy.x;my+=joy.y;let l=Math.hypot(mx,my)||1,s=.08*dt*60,fx=Math.cos(p.a),fy=Math.sin(p.a),rx=-fy,ry=fx;move((fx*my+rx*mx)/l*s,(fy*my+ry*mx)/l*s);for(const b of bots){let dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy);if(d>1.2){let q=.012*dt*60;b.x+=dx/d*q;b.y+=dy/d*q;if(wall(b.x,b.y)){b.x-=dx/d*q;b.y-=dy/d*q}}else{hp-=10*dt;ui();if(hp<=0)return gameOver()}}}
function draw(){let h=H/2;x.fillStyle="#071329";x.fillRect(0,0,W,h);x.fillStyle="#101922";x.fillRect(0,h,W,H-h);let n=Math.ceil(W/2),z=new Float32Array(n);for(let i=0;i<n;i++){let a=p.a-FOV/2+i/n*FOV,d=ray(a)*Math.cos(a-p.a);z[i]=d;let wh=Math.min(H*2,H/(d*.72)),yy=h-wh/2,sh=Math.max(.15,1-d/16);x.fillStyle="rgb("+~~(18+35*sh)+","+~~(48+80*sh)+","+~~(70+100*sh)+")";x.fillRect(i*2,yy,2,wh)}
bots.slice().sort((a,b)=>Math.hypot(b.x-p.x,b.y-p.y)-Math.hypot(a.x-p.x,a.y-p.y)).forEach(b=>{let dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx)-p.a;while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;if(Math.abs(a)>FOV*.65)return;let cd2=d*Math.cos(a),sx=(.5+a/FOV)*W,wh=Math.min(H*1.4,H/(cd2*.72)),zi=Math.max(0,Math.min(n-1,~~(sx/2)));if(cd2<=z[zi]+.1){x.save();x.translate(sx,h-wh*.15);x.fillStyle="#ff3e96";x.beginPath();x.arc(0,wh*.08,wh*.15,0,7);x.fill();x.fillStyle="#72164b";x.fillRect(-wh*.18,wh*.2,wh*.36,wh*.32);x.fillStyle="#ffe66b";x.beginPath();x.arc(-wh*.055,wh*.06,wh*.025,0,7);x.arc(wh*.055,wh*.06,wh*.025,0,7);x.fill();x.restore()}});x.save();x.translate(W/2,H*.88);x.fillStyle="#15283a";x.strokeStyle="#65eaff";x.lineWidth=2;x.beginPath();x.moveTo(-45,55);x.lineTo(-25,-65);x.lineTo(25,-65);x.lineTo(45,55);x.closePath();x.fill();x.stroke();x.fillStyle="#6ef";x.fillRect(-4,-95,8,55);x.restore()}
function loop(t){if(!run)return;let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();if(run)requestAnimationFrame(loop)}
function begin(){reset();run=true;menu.classList.add("hidden");hud.classList.remove("hidden");last=performance.now();requestAnimationFrame(loop)}start.onclick=begin;
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
c.addEventListener("pointerdown",e=>{if(!run)return;if(e.clientX<W*.42){mt={id:e.pointerId,x:e.clientX,y:e.clientY}}else{look={id:e.pointerId,x:e.clientX,y:e.clientY};fire()}});
c.addEventListener("pointermove",e=>{if(mt&&e.pointerId===mt.id){joy.x=Math.max(-1,Math.min(1,(e.clientX-mt.x)/70));joy.y=-Math.max(-1,Math.min(1,(e.clientY-mt.y)/70))}if(look&&e.pointerId===look.id){p.a+=(e.clientX-look.x)*.008;look.x=e.clientX}});
c.addEventListener("pointerup",e=>{if(mt&&e.pointerId===mt.id){mt=null;joy={x:0,y:0}}if(look&&e.pointerId===look.id)look=null});
</script></body></html>
