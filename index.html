</head><body>
<canvas id="g"></canvas>
<div id="hud"><b id="status" class="pill">CONNECTING...</b><b id="players" class="pill">PLAYERS 1</b><div id="joystick"><div id="joystickThumb"></div></div></div>
<script>

let W,H,D=1,run=false,last=0,keys={},joy={x:0,y:0},look=null,peer=null,hostConn=null,isHost=false,myId="",players={},connections=[],netClock=0,frameClock=0,anim=0;const TV_MODE=true,MAX_FPS=30,QUALITY=.52;
const arenaMap=["111111111111111","100000000000001","100000000000001","100000000000001","100000000000001","100000000000001","100000000000001","100000000000001","100000000000001","100000000000001","100000000000001","100000000000001","111111111111111"],lobbyMap=["111111111101111111111","100000000000000000001","100000000000000000001","100000000000000000001","100000000000000000001","100000000000000000001","100000000000000000001","100000000000000000001","100000000000000000001","100000000000000000001","100000000000000000001","100000000000000000001","111111111111111111111"],FOV=Math.PI/2.85,p={x:7.5,y:10.5,a:-Math.PI/2};let gameMode="lobby";let doorOpen=0;function activeMap(){return gameMode==="lobby"?lobbyMap:arenaMap}

 }

 Object.values(players).filter(q=>q.id!==myId&&q.mode===gameMode).forEach(q=>{
  let dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx)-p.a;while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;if(Math.abs(a)>FOV*.7)return;
  let cd=d*Math.cos(a),sx=(.5+a/FOV)*W,wh=Math.min(H*1.4,H/(cd*.72)),zi=Math.max(0,Math.min(n-1,~~(sx/2)));if(cd<=z[zi]+.1){

   x.fillStyle="#304b35";x.fillRect(-wh*.17,wh*.15,wh*.34,wh*.38);x.strokeRect(-wh*.17,wh*.15,wh*.34,wh*.38);

   x.save();x.translate(wh*.19,wh*.19);x.rotate(.12-Math.sin(anim*1.7+d)*.04);x.fillRect(-wh*.33,0,wh*.36,wh*.065);x.restore();

 if(gameMode==="lobby"){let dx=realX-p.x,dy=realY-p.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx)-p.a;while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;if(d>.05&&Math.abs(a)<FOV*.72){let cd=d*Math.cos(a),sx=(.5+a/FOV)*W,wh=Math.min(H*1.2,H/(Math.max(.2,cd)*.72)),zi=Math.max(0,Math.min(n-1,~~(sx/2)));if(cd<=z[zi]+.1){x.save();x.translate(sx,h-wh*.15);x.fillStyle="#567a58";x.strokeStyle="#263d2b";x.lineWidth=Math.max(1,wh*.018);x.beginPath();x.arc(0,-wh*.02,wh*.14,0,7);x.fill();x.stroke();x.fillStyle="#304b35";x.fillRect(-wh*.17,wh*.15,wh*.34,wh*.38);x.strokeRect(-wh*.17,wh*.15,wh*.34,wh*.38);x.fillStyle="#73966b";x.fillRect(-wh*.19,wh*.19,wh*.38,wh*.065);x.fillStyle="#243326";x.fillRect(-wh*.12,wh*.53,wh*.09,wh*.25);x.fillRect(wh*.03,wh*.53,wh*.09,wh*.25);x.restore();}}}else{x.save();x.translate(W/2,H*.88);x.fillStyle="#243747";x.strokeStyle="#0b1822";x.lineWidth=4;x.beginPath();x.roundRect(-50,-60,100,110,18);x.fill();x.stroke();x.fillStyle="#65eaff";x.fillRect(-30,-30,60,12);x.fillRect(-18,-5,36,7);x.fillStyle="#40596b";x.fillRect(-35,25,70,18);x.restore();}

addEventListener("keydown",e=>{let k=e.key;if(k==="ArrowUp"||k==="ArrowDown"||k==="ArrowLeft"||k==="ArrowRight"||k==="w"||k==="a"||k==="s"||k==="d"){e.preventDefault();keys[k.toLowerCase()]=1}});addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=0});
let mt=null,joyBase=null;
